<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bảng điều khiển hệ thống quản lý bán hàng và kho SaleStock."
    />
    <title>Tổng quan | SaleStock</title>
    <link rel="icon" href="/assets/brand-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/dashboard.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- ── Sidebar ── -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <a class="sidebar__brand" href="/dashboard">
            <img src="/assets/brand-mark.svg" alt="" class="sidebar__logo" />
            <span class="sidebar__brand-name">SaleStock</span>
          </a>
          <button
            class="sidebar__close"
            id="sidebar-close"
            aria-label="Đóng menu"
          >
            <svg viewBox="0 0 24 24">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <nav class="sidebar__nav" id="sidebar-nav" aria-label="Menu chính">
          <!-- Menu items rendered by JS -->
        </nav>

        <div class="sidebar__footer">
          <div class="sidebar__user" id="sidebar-user">
            <button
              class="sidebar__avatar"
              id="btn-avatar"
              type="button"
              title="Cập nhật ảnh đại diện"
              aria-label="Cập nhật ảnh đại diện"
            >
              <span id="user-avatar-fallback">A</span>
              <img id="user-avatar-image" alt="" hidden />
            </button>
            <div class="sidebar__user-info">
              <span class="sidebar__user-name" id="user-name">—</span>
              <span class="sidebar__user-role" id="user-role">—</span>
            </div>
          </div>
          <button class="sidebar__logout" id="btn-logout" title="Đăng xuất">
            <svg viewBox="0 0 24 24">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </aside>

      <!-- ── Main content ── -->
      <div class="main-area">
        <header class="topbar">
          <button
            class="topbar__menu-btn"
            id="sidebar-toggle"
            aria-label="Mở menu"
          >
            <svg viewBox="0 0 24 24">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div class="topbar__breadcrumb">
            <span id="page-title">Tổng quan</span>
          </div>

          <div class="topbar__actions">
            <a class="topbar__btn topbar__btn--icon" href="/profile" title="Hồ sơ cá nhân" aria-label="Hồ sơ cá nhân">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 22a8 8 0 0 1 16 0"/></svg>
            </a>
            <button
              class="topbar__btn topbar__btn--icon"
              id="btn-change-password"
              title="Đổi mật khẩu"
            >
              <svg viewBox="0 0 24 24">
                <rect x="4" y="10" width="16" height="11" rx="2" />
                <path d="M8 10V7a4 4 0 0 1 8 0v3" />
              </svg>
            </button>
            <button
              class="topbar__btn topbar__btn--logout"
              id="btn-logout-topbar"
              title="Đăng xuất"
            >
              <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
              <span>Đăng xuất</span>
            </button>
          </div>
        </header>

        <main class="content" id="main-content">
          <div class="welcome-card" id="welcome-card">
            <div class="welcome-card__text">
              <h1 id="welcome-greeting">Chào mừng quay lại</h1>
            </div>
            <div class="welcome-card__time" id="current-time"></div>
          </div>

          <section class="dashboard-work" aria-labelledby="work-title">
            <h2 id="work-title">Công việc</h2>
            <div class="work-list" id="work-list"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- ── Avatar Modal ── -->
    <div class="modal-overlay" id="modal-avatar" hidden>
      <div class="modal" role="dialog" aria-labelledby="modal-avatar-title">
        <div class="modal__header">
          <h2 id="modal-avatar-title">Cập nhật ảnh đại diện</h2>
          <button class="modal__close" data-close-avatar aria-label="Đóng">
            <svg viewBox="0 0 24 24">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form class="modal__body" id="form-avatar" novalidate>
          <div class="avatar-editor__preview" aria-label="Xem trước ảnh đại diện">
            <span id="avatar-preview-fallback">A</span>
            <img id="avatar-preview-image" alt="Ảnh đại diện xem trước" hidden />
          </div>

          <div class="form-field avatar-editor__field">
            <label for="avatar-file">Chọn ảnh</label>
            <input
              type="file"
              id="avatar-file"
              accept=".jpg,.jpeg,.png,image/jpeg,image/png"
              required
            />
            <small>JPG, JPEG hoặc PNG; dung lượng tối đa 2MB. Ảnh sẽ được cắt vuông từ chính giữa.</small>
          </div>

          <div class="avatar-editor__message" id="avatar-message" role="alert" hidden></div>

          <div class="modal__actions">
            <button type="button" class="btn btn--secondary" data-close-avatar>
              Huỷ
            </button>
            <button type="submit" class="btn btn--primary" id="btn-avatar-submit">
              Lưu ảnh
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- ── Change Password Modal ── -->
    <div class="modal-overlay" id="modal-change-password" hidden>
      <div class="modal" role="dialog" aria-labelledby="modal-cp-title">
        <div class="modal__header">
          <h2 id="modal-cp-title">Đổi mật khẩu</h2>
          <button class="modal__close" data-close-modal aria-label="Đóng">
            <svg viewBox="0 0 24 24">
              <path d="M18 6 6 18M6 6l12 12" />
            </svg>
          </button>
        </div>

        <form class="modal__body" id="form-change-password" novalidate>
          <div class="form-field">
            <label for="cp-current">Mật khẩu hiện tại</label>
            <input
              type="password"
              id="cp-current"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="form-field">
            <label for="cp-new">Mật khẩu mới</label>
            <input
              type="password"
              id="cp-new"
              required
              minlength="8"
              autocomplete="new-password"
            />
            <small>Tối thiểu 8 ký tự, có cả chữ và số</small>
          </div>

          <div class="form-field">
            <label for="cp-confirm">Xác nhận mật khẩu mới</label>
            <input
              type="password"
              id="cp-confirm"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="modal__actions">
            <button type="button" class="btn btn--secondary" data-close-modal>
              Huỷ
            </button>
            <button type="submit" class="btn btn--primary" id="btn-cp-submit">
              Đổi mật khẩu
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/menu-config.js"></script>
    <script src="/js/dashboard.js"></script>
  </body>
</html>
