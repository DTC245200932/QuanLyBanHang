<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Không thể mở trang | SaleStock</title><link rel="stylesheet" href="css/auth-pages.css"></head>
<body><main class="auth-card"><a class="auth-brand" href="dashboard.html"><img src="assets/brand-mark.svg" alt=""><span>SaleStock</span></a><p class="error-code" id="error-code">403</p><h1 id="error-title">Bạn chưa có quyền vào đây</h1><p class="lead" id="error-message">Hãy quay lại phần công việc được giao hoặc liên hệ quản trị viên nếu bạn cần thêm quyền.</p><div class="action-row"><a class="action-primary" href="dashboard.html">Về trang tổng quan</a><a class="action-secondary" href="javascript:history.back()">Quay lại</a></div></main><script>const p=new URLSearchParams(location.search),s=p.get('status')||'403';document.getElementById('error-code').textContent=s;if(s==='404'){document.getElementById('error-title').textContent='Không tìm thấy trang';document.getElementById('error-message').textContent='Địa chỉ có thể đã thay đổi. Hãy về trang tổng quan để tiếp tục.'}else{const m=sessionStorage.getItem('errorMessage');if(m){document.getElementById('error-message').textContent=m;sessionStorage.removeItem('errorMessage')}}</script></body></html>
