<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hồ sơ cá nhân | SaleStock</title>
  <link rel="icon" href="/assets/brand-mark.svg">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/profile.css">
<link rel="stylesheet" href="/css/app-shell.css">
<link rel="stylesheet" href="/css/app-navigation.css">
</head>
<body>
  <main class="profile-page" data-app-content>
    <header class="profile-header" data-standalone-header>
      <a class="profile-brand" href="/dashboard"><img src="/assets/brand-mark.svg" alt=""><span>SaleStock</span></a>
      <a class="profile-back" href="/dashboard">Về trang tổng quan</a>
    </header>

    <section class="profile-layout" aria-labelledby="profile-title">
      <aside class="profile-summary">
        <div class="profile-avatar-wrap">
          <div class="profile-avatar" id="profile-avatar" aria-label="Ảnh đại diện hiện tại">
            <span id="profile-avatar-fallback">U</span>
            <img id="profile-avatar-image" alt="Ảnh đại diện" hidden>
          </div>
          <input id="profile-avatar-file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
          <button class="profile-avatar-button" id="profile-avatar-change" type="button">Đổi ảnh đại diện</button>
          <p class="profile-avatar-hint">JPG, JPEG hoặc PNG · tối đa 2MB</p>
          <div id="profile-avatar-message" class="profile-avatar-message" role="alert" hidden></div>
        </div>
        <h1 id="profile-title">Hồ sơ cá nhân</h1>
        <p id="profile-account">Đang tải…</p>
        <dl>
          <div><dt>Vai trò</dt><dd id="profile-roles">—</dd></div>
          <div><dt>Kho phụ trách</dt><dd id="profile-warehouses">—</dd></div>
          <div><dt>Địa bàn</dt><dd id="profile-territories">—</dd></div>
        </dl>
      </aside>

      <form class="profile-card" id="profile-form">
        <div class="profile-card__heading">
          <h2>Thông tin liên hệ</h2>
          <p>Bạn chỉ có thể cập nhật họ tên và số điện thoại.</p>
        </div>
        <label><span>Tên đăng nhập</span><input id="profile-username" disabled></label>
        <label><span>Email</span><input id="profile-email" type="email" disabled></label>
        <label><span>Họ và tên</span><input id="profile-full-name" maxlength="100" required></label>
        <label><span>Số điện thoại Việt Nam</span><input id="profile-phone" inputmode="tel" maxlength="15" required placeholder="0901234567"></label>
        <div id="profile-message" class="profile-message" hidden></div>
        <button class="btn btn--primary" id="profile-save" type="submit">Lưu thay đổi</button>
      </form>
    </section>
  </main>
  <script src="/js/auth.js"></script>
  <script src="/js/menu-config.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/app-navigation.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
